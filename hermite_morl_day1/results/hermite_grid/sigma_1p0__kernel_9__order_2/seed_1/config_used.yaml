project_root: .
seed: 1
experiment:
  seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
  output_root: results\hermite_grid\sigma_1p0__kernel_9__order_2\seed_1
  active_hermite_grid_config:
    sigma: 1.0
    kernel_size: 9
    max_order: 2
  active_hermite_grid_slug: sigma_1p0__kernel_9__order_2
dataset:
  raw_dir: data/raw
  use_skimage_if_empty: true
  image_size: 64
  train_images: 40
  val_images: 10
  test_images: 10
hermite:
  max_order: 2
  sigma: 1.0
  kernel_size: 9
  scales:
  - 1.5
  component_rule: total_order_lte
hermite_sweep:
  enabled: true
  sigmas:
  - 1.0
  - 1.5
  - 2.0
  kernel_sizes:
  - 9
  - 13
  - 17
  max_orders:
  - 2
  - 3
  - 4
  run_reconstruction_ablation: true
  run_baselines: true
  evaluate_agent_if_checkpoint_exists: true
  train_agent_per_config: false
  agent_train_configs:
  - sigma: 1.0
    kernel_size: 9
    max_order: 3
  - sigma: 1.5
    kernel_size: 13
    max_order: 3
  - sigma: 2.0
    kernel_size: 17
    max_order: 3
evaluation:
  ks:
  - 1
  - 3
  - 5
  - 10
  equal_budget:
    enabled: true
    n_solutions: 50
    repetitions: 20
    seed: 123
  same_k:
    enabled: true
    k_column: paid_k
  image_quality_metrics:
    enabled: true
    metrics:
    - psnr
  edge_metrics:
    enabled: true
    affect_training: false
    metrics:
    - gradient_mse
    - edge_corr
external_eval:
  enabled: false
  raw_dir: data/external_dfu
  max_images: 20
  image_size: 64
  grayscale: true
env:
  max_steps: 10
  reward_dim: 4
  action_stop: true
  calibrated_reconstruction: true
  detail_only_h00_free: true
  base_components:
  - 0
  count_base_components_in_k: false
  count_base_components_in_cost: false
  repeated_action_penalty: -0.05
  terminate_on_repeated_action: false
  random_episode_steps: 11
cost:
  mode: extra_kernel_flops
  free_kernel_size: 13
  normalize: true
  eps: 1.0e-08
  allow_legacy_count_mode: true
reward:
  normalize: true
  eps: 1.0e-08
  mode: relative
reconstruction:
  mode: least_squares
  ridge: 1.0e-06
  clip_output: true
  normalize_output: true
training:
  episodes: 3000
  batch_size: 64
  replay_size: 50000
  gamma: 0.95
  lr: 0.001
  hidden_dim: 128
  warmup_steps: 128
  target_update_every: 250
  eval_every: 250
  eval_max_images: null
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 3000
  use_envelope_target: true
  device: auto
  preferences:
  - - 0.55
    - 0.25
    - 0.1
    - 0.1
  - - 0.35
    - 0.35
    - 0.15
    - 0.15
  - - 0.25
    - 0.25
    - 0.25
    - 0.25
  - - 0.2
    - 0.2
    - 0.3
    - 0.3
  - - 0.15
    - 0.15
    - 0.35
    - 0.35
